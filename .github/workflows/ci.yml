name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:pack

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        node:
          - 26.13.0
          - 24.15.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # agent-host 的测试在 Linux 上也用真实沙盒
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-sandbox
      - run: npm ci --ignore-scripts
      - run: npm test

  # sandbox 包自己的测试和 sandbox 专项评测在四个 runner 上用真实沙盒运行，没有后端或后端启动不了时失败，不跳过
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-26
        node:
          - 26.13.0
          - 24.15.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-sandbox
      - run: npm ci --ignore-scripts
      # 测试里的辅助进程入口取自构建出来的 dist；专项评测经 Host 启动 agent 进程，各个包都要先构建
      - run: npm run build
      - run: >-
          npx vitest run
          packages/sandbox
          packages/evaluation/test/sandbox-decisions.test.ts
          packages/evaluation/test/sandbox-suite.test.ts
          --tags-filter='!model'

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Every commit is signed off by its author
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          node scripts/check-dco.ts "$range"
