name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - run: |
          echo "PATH=$PATH"
          ls -la /etc/bashrc /etc/profile /etc/zshenv 2>&1 || true
          echo "--- env -i bash -xc"
          env -i PATH="$PATH" bash -xc 'echo up' </dev/null 2>&1 | cat
          echo "--- env -i /bin/bash -c with SHLVL"
          env -i PATH="$PATH" SHLVL=1 /bin/bash -c 'echo up' </dev/null 2>&1 | cat
          echo "--- node spawn"
          node -e 'const {spawnSync}=require("child_process"); for (const argv of [["bash","-xc","echo up"],["bash","-c","echo $BASH_ENV; echo $-; type brew"]]) { const r=spawnSync(argv[0],argv.slice(1),{env:{PATH:process.env.PATH},stdio:["ignore","pipe","pipe"]}); console.log(JSON.stringify({argv,o:r.stdout.toString(),e:r.stderr.toString()})) }'
          echo "--- node spawn, stdin pipe"
          node -e 'const {spawnSync}=require("child_process"); const r=spawnSync("bash",["-xc","echo up"],{env:{PATH:process.env.PATH},stdio:["pipe","pipe","pipe"]}); console.log(JSON.stringify({o:r.stdout.toString(),e:r.stderr.toString()}))'
          echo "--- dtruss-free: which files bash opens"
          cat /etc/bashrc 2>/dev/null | head -40 || true
          ls -la ~/.bashrc ~/.bash_profile ~/.profile 2>&1 || true
          grep -rn "brew" /etc/bashrc /etc/profile /etc/paths.d 2>/dev/null | head || true
