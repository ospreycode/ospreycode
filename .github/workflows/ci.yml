name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        part: [sandbox, eval, host]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: ./.github/actions/linux-sandbox
      - run: npm ci --ignore-scripts
      - run: npm run build
      - if: matrix.part == 'sandbox'
        run: npx vitest run packages/sandbox/test/backend.test.ts packages/sandbox/test/profile.test.ts --reporter=verbose --tags-filter='!model' 2>&1 | tee out.log || true
      - if: matrix.part == 'eval'
        run: npx vitest run packages/evaluation/test/sandbox-suite.test.ts --reporter=verbose --tags-filter='!model' 2>&1 | tee out.log || true
      - if: matrix.part == 'host'
        run: npx vitest run packages/agent-host/test/restart.test.ts packages/agent-host/test/sandbox-run.test.ts --reporter=verbose --tags-filter='!model' 2>&1 | tee out.log || true
