name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm run check
      - run: npm test
      - run: npm run check:pack
      - name: Stage the public packages
        run: |
          for dir in $(node -e 'const { workspaces } = require("./package.json"); for (const dir of workspaces) if (!require(`./${dir}/package.json`).private) console.log(dir)'); do
            (cd "$dir" && npm stage publish --ignore-scripts)
          done
